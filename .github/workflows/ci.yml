name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Least privilege by default. Jobs that need more ask for it themselves; today
# only the CodeQL job does, and only for security-events.
permissions:
  contents: read

# A superseded run tells you nothing and still holds a runner. Cancel it.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Every `uses:` in this repository is pinned to a commit SHA rather than a
  # tag. A tag is mutable: whoever controls the action can repoint it, and a
  # compromised action runs with this workflow's token. The trailing comment
  # records which release each SHA corresponds to.
  check:
    name: Typecheck, lint, format, test with coverage
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: 26
          cache: npm

      - name: Install dependencies
        run: npm ci

      # One command, the same one a contributor runs: generates the binding
      # types and the shared front-end modules, then typechecks, lints, checks
      # formatting and runs every test. Coverage below 100% fails it.
      - name: Check
        run: npm run check

      - name: Upload coverage summary
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: coverage
          path: coverage/
          retention-days: 14

  audit:
    name: Dependency audit
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: 26
      # The whole tree, dev dependencies included, at every severity. No
      # suppression, no `|| true`, no `--omit=dev`: any advisory fails the build.
      - name: Audit dependencies
        run: npm audit

  secrets:
    name: Secret scan
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      # The service reaches inference through a Cloudflare binding and air data
      # through a keyless API, so it has no credential by design. This job
      # keeps it that way.
      - name: Assert no credentials are committed
        run: |
          if grep -rEn "(sk-[A-Za-z0-9]{20,}|AIza[A-Za-z0-9_-]{30,}|CLOUDFLARE_API_TOKEN\s*=\s*[A-Za-z0-9._-]{20,})" \
               --include="*.ts" --include="*.js" --include="*.mjs" --include="*.json" \
               --include="*.jsonc" --include="*.yml" --include="*.md" . ; then
            echo "::error::A credential-shaped string was found in the repository."
            exit 1
          fi
          echo "No credentials found."
